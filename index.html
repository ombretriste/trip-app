<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>TripCTRL</title>
  <meta name="description" content="Tus viajes: plan día a día, documentos en regla, gastos y maleta." />
  <meta name="theme-color" content="#120a0c" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TripCTRL" />
  <meta name="color-scheme" content="dark light" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    // Aplica tema y fondo antes de pintar (evita un destello del tema equivocado)
    try {
      var d = JSON.parse(localStorage.getItem('tripctrl:display') || '{}');
      var light = d.theme === 'light' || (d.theme !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches);
      document.documentElement.dataset.theme = light ? 'light' : 'dark';
      document.documentElement.dataset.wall = d.wall || 'coral';
    } catch (e) {}
  </script>
</head>
<body class="booting">
  <!-- Pantalla de inicio -->
  <div id="splash" class="splash">
    <div class="sp-main">
      <span class="logo-slot" data-logo="132"></span>
      <div class="wordmark">
        <span class="wm-name">Trip<b>CTRL</b></span>
        <span class="wm-by">by OmT Finance</span>
      </div>
    </div>
    <p class="sp-version" id="app-version"></p>
  </div>

  <!-- App -->
  <div id="app" class="app">
    <header class="topbar">
      <div class="brand-wrap">
        <span class="logo-slot" data-logo="30"></span>
        <span class="brand">Trip<b>CTRL</b></span>
      </div>
      <button id="menu-btn" class="icon-btn" aria-label="Más opciones" title="Más opciones" aria-haspopup="menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><g fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></g></svg>
      </button>
    </header>

    <main>
      <section class="card summary" id="summary" aria-live="polite"></section>
      <div class="people-row" id="people-row" aria-label="Filtrar viajes"></div>
      <div class="search-wrap">
        <input id="search" type="search" placeholder="Buscar viaje, destino, reserva…" autocomplete="off" />
      </div>
      <section id="list" class="list"></section>
    </main>

    <nav class="bottombar" aria-label="Acciones">
      <button class="add-btn" id="add-btn" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>Nuevo viaje</span>
      </button>
    </nav>
  </div>

  <div class="rotate-hint" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></svg>
    <p>Gira el móvil a vertical</p>
  </div>

  <div id="menu" class="menu" role="menu" hidden></div>
  <input type="file" id="import-input" accept=".json,application/json" hidden />

  <script src="app.js"></script>
</body>
</html>
